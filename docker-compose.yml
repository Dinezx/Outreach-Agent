services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadminerai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadminerai"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/leadminerai
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn leadminerai.main:app --host 0.0.0.0 --port 8000"
